name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: deploy

jobs:

  build:
    name: Build, Dockerize and Deploy
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout source code
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # Setup Java 25
      # ==========================================
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven


      # ==========================================
      # Build Spring Boot application
      # ==========================================
      - name: Build with Maven
        run: mvn clean package -DskipTests


      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================
      # Build Docker Image
      # ==========================================
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest .


      # ==========================================
      # Push Docker Image
      # ==========================================
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest


      # ==========================================
      # Deploy to EC2
      # ==========================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting deployment..."
            echo "======================================"

            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest

            # Stop old container
            docker stop deploy || true

            # Remove old container
            docker rm deploy || true

            # Start new container
            docker run -d \
              --name deploy \
              -p 9090:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest

            # Remove dangling/unused images
            docker image prune -f

            echo "======================================"
            echo "Deployment completed!"
            echo "======================================"

            # Show running containers
            docker ps

            # Show application logs
            docker logs --tail 50 deploy