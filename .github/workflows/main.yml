name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: deploy

jobs:

  # ==========================================
  # CI - Build and Test
  # ==========================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Build Spring Boot application
      - name: Build with Maven
        run: mvn clean package -DskipTests



  # ==========================================
  # CD - Docker Hub + EC2 Deployment
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================
      # Build Docker Image
      # ==========================================
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest .


      # ==========================================
      # Push Docker Image
      # ==========================================
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest


      # ==========================================
      # Deploy to EC2
      # ==========================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting deployment..."

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest

            # Stop old container if running
            docker stop demo-app || true

            # Remove old container
            docker rm demo-app || true

            # Start new container
            docker run -d \
              --name demo-app \
              -p 9090:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/deploy:latest

            # Remove unused Docker images
            docker image prune -f

            echo "Deployment completed successfully!"

            # Show running containers
            docker ps